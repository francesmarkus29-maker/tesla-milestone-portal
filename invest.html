<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tesla Milestone Portal - Invest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center p-4">
  <div class="bg-black border border-white/20 rounded-2xl p-6 w-full max-w-md shadow-2xl">
    
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold tracking-wide text-white">Tesla Milestone Investment</h1>
      <p class="text-gray-400 text-sm mt-1">Select your investment plan and submit payment proof</p>
    </div>

    <!-- Payment Details Box -->
    <div class="bg-neutral-900 border border-white/10 rounded-xl p-4 mb-6 space-y-4 text-center">
      <div>
        <p class="text-xs text-gray-400 uppercase tracking-wider mb-1">Bitcoin Deposit Address</p>
        <div class="bg-black p-2 rounded border border-white/10 font-mono text-xs text-white select-all break-all">
          bc1qxy2kgdyjrsqtqz2n0yrf2493p83kkfjhx0wlh
        </div>
      </div>
    </div>

    <!-- Investment Form -->
    <form id="deposit-form" onsubmit="submitPaymentProof(event)" class="space-y-4">
      
      <!-- Investment Amount Selection -->
      <div>
        <label class="block text-xs font-medium text-gray-300 uppercase tracking-wider mb-1">Select Investment Amount ($ USD)</label>
        <select id="invest-amount" required
          class="w-full bg-black border border-white/20 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-white">
          <option value="100">$100 USD</option>
          <option value="500">$500 USD</option>
          <option value="1000">$1,000 USD</option>
          <option value="5000">$5,000 USD</option>
          <option value="10000">$10,000 USD</option>
        </select>
      </div>

      <!-- Investment Duration Selection -->
      <div>
        <label class="block text-xs font-medium text-gray-300 uppercase tracking-wider mb-1">Investment Duration (Years)</label>
        <select id="invest-years" required
          class="w-full bg-black border border-white/20 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-white">
          <option value="1">1 Year</option>
          <option value="2">2 Years</option>
          <option value="3">3 Years</option>
          <option value="5">5 Years</option>
        </select>
      </div>

      <!-- Transaction Hash / ID -->
      <div>
        <label class="block text-xs font-medium text-gray-300 uppercase tracking-wider mb-1">Transaction Hash / ID</label>
        <input type="text" id="tx-hash" required placeholder="Enter transaction hash" 
          class="w-full bg-black border border-white/20 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-white">
      </div>

      <!-- Payment Screenshot Upload -->
      <div>
        <label class="block text-xs font-medium text-gray-300 uppercase tracking-wider mb-1">Upload Payment Screenshot</label>
        <input type="file" id="payment-screenshot" accept="image/*" required
          class="w-full bg-black border border-white/20 rounded-lg px-3 py-2 text-gray-400 text-sm file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-white file:text-black hover:file:bg-gray-200">
      </div>

      <button type="submit" id="submit-btn" 
        class="w-full bg-white hover:bg-gray-200 text-black font-semibold py-2.5 rounded-lg transition-all duration-200 text-sm shadow-lg">
        Submit Payment Proof for Approval
      </button>
    </form>

  </div>

  <script>
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }

    async function submitPaymentProof(e) {
      if (e && e.preventDefault) e.preventDefault();
      
      const btn = document.getElementById('submit-btn');
      btn.innerText = "Transmitting to Telegram & Cloud...";
      btn.disabled = true;

      try {
        const chatId = localStorage.getItem('telegramChatId') || "123456789"; 
        const amount = document.getElementById('invest-amount').value;
        const years = document.getElementById('invest-years').value;
        const txHash = document.getElementById('tx-hash').value;

        // Send data securely to your live Render backend API
        const response = await fetch('https://tesla-milestone-portal.onrender.com/api/deposit', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            chatId: chatId,
            amount: parseFloat(amount),
            years: parseInt(years),
            txHash: txHash,
            status: 'pending' // Marked as pending so admin can approve it
          })
        });

        if (response.ok) {
          alert("Payment proof submitted successfully! Your deposit is pending approval from Telegram.");
          window.location.href = 'dashboard.html';
        } else {
          throw new Error('Network transmission error.');
        }
      } catch (err) {
        console.error(err);
        alert("Network transmission error. Please try again.");
        btn.innerText = "Submit Payment Proof for Approval";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
