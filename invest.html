<<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invest - Tesla Milestone Portal</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-900 text-white p-4">

    <div class="bg-gray-800 p-8 rounded-xl shadow-2xl max-w-md w-full border border-gray-700 text-center">
        <h1 class="text-2xl font-bold mb-2">Tesla Investment Milestone</h1>
        <p class="text-gray-400 mb-6">Scan the QR code or copy the address below to make your deposit.</p>

        <!-- QR Code Placeholder / Image Container -->
        <div class="bg-white p-4 rounded-lg inline-block mb-4">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=bc1qxy2kgdygjrsqtqzq2n0yrf2493p83kkfjhx0wlh" alt="Bitcoin QR Code" class="mx-auto">
        </div>

        <div class="mb-6">
            <label class="block text-xs text-gray-400 mb-1 uppercase tracking-wider">Bitcoin Deposit Address</label>
            <div class="bg-gray-900 p-3 rounded border border-gray-700 text-sm font-mono text-yellow-400 break-all select-all">
                bc1qxy2kgdygjrsqtqzq2n0yrf2493p83kkfjhx0wlh
            </div>
        </div>

        <div class="mb-6 text-left">
            <label class="block text-xs text-gray-400 mb-1 uppercase tracking-wider">Amount Due</label>
            <div class="text-xl font-semibold text-green-400">$100 USD</div>
        </div>

        <div class="mb-4 text-left">
            <label class="block text-sm text-gray-300 mb-1">Transaction Hash / ID</label>
            <input type="text" id="tx-hash" placeholder="Enter your transaction hash" class="w-full p-3 bg-gray-900 border border-gray-700 rounded text-sm focus:outline-none focus:border-yellow-500">
        </div>

        <div class="mb-6 text-left">
            <label class="block text-sm text-gray-300 mb-1">Upload Payment Screenshot</label>
            <input type="file" id="payment-screenshot" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-yellow-500 file:text-gray-900 hover:file:bg-yellow-400 cursor-pointer">
        </div>

        <!-- Submit Button -->
        <button id="submit-btn" onclick="submitPaymentProof()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-gray-950 font-bold py-3 px-4 rounded transition duration-200">
            Submit Payment Proof for Approval
        </button>
    </div>

    <script>
        // Initialize Lucide icons if any are used
        lucide.createIcons();

        async function submitPaymentProof() {
            const btn = document.getElementById('submit-btn');
            const txHash = document.getElementById('tx-hash').value.trim();

            if (!txHash) {
                alert("Please enter your transaction hash or ID.");
                return;
            }

            btn.innerText = "Transmitting to Cloud...";
            btn.disabled = true;

            try {
                // Get chat ID from localStorage (or fallback for local testing)
                const chatId = localStorage.getItem('telegramChatId') || "123456789";
                const amount = 100; // Set your investment tier amount here

                // Send request securely to your live Render backend
                const response = await fetch('https://tesla-milestone-portal.onrender.com/api/deposit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chatId: chatId,
                        amount: amount,
                        txHash: txHash
                    })
                });

                if (response.ok) {
                    alert("Payment proof submitted successfully! Your balance has been updated.");
                    // Instantly take them to the dashboard
                    window.location.href = 'dashboard.html';
                } else {
                    throw new Error('Server returned an error response.');
                }
            } catch (err) {
                console.error(err);
                alert("Network transmission error. Please try again.");
                btn.innerText = "Submit Payment Proof for Approval";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
