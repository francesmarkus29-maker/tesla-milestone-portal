<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tesla Milestone Portal - Invest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4">
  <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 w-full max-w-md shadow-2xl">
    
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold tracking-wide">Tesla Milestone Investment</h1>
      <p class="text-gray-400 text-sm mt-1">Complete your deposit to activate your account</p>
    </div>

    <!-- Payment Details Box -->
    <div class="bg-gray-950 border border-gray-800 rounded-xl p-4 mb-6 space-y-4 text-center">
      <div>
        <p class="text-xs text-gray-400 uppercase tracking-wider mb-1">Bitcoin Deposit Address</p>
        <div class="bg-gray-900 p-2 rounded border border-gray-800 font-mono text-xs text-emerald-400 select-all break-all">
          bc1qxy2kgdyjrsqtqz2n0yrf2493p83kkfjhx0wlh
        </div>
      </div>
      <div>
        <p class="text-xs text-gray-400 uppercase tracking-wider">Amount Due</p>
        <p class="text-xl font-bold text-white mt-0.5">$100 USD</p>
      </div>
    </div>

    <!-- Deposit Form -->
    <form id="deposit-form" onsubmit="submitPaymentProof(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-gray-300 uppercase tracking-wider mb-1">Transaction Hash / ID</label>
        <input type="text" id="tx-hash" required placeholder="Enter transaction hash" 
          class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-emerald-500">
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-300 uppercase tracking-wider mb-1">Upload Payment Screenshot</label>
        <input type="file" id="payment-screenshot" accept="image/*" required
          class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-gray-400 text-sm file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-gray-800 file:text-white hover:file:bg-gray-700">
      </div>

      <button type="submit" id="submit-btn" 
        class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg transition-all duration-200 text-sm shadow-lg shadow-emerald-900/20">
        Submit Payment Proof for Approval
      </button>
    </form>

  </div>

  <script>
    // Initialize Lucide icons
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }

    async function submitPaymentProof(e) {
      if (e && e.preventDefault) e.preventDefault();
      
      const btn = document.getElementById('submit-btn');
      btn.innerText = "Transmitting to Cloud...";
      btn.disabled = true;

      try {
        // Grab the chat ID from storage or fall back to a default sandbox ID
        const chatId = localStorage.getItem('telegramChatId') || "123456789"; 
        const amount = 100; // Fixed deposit tier amount for this package

        // Send request to your live Render backend
        const response = await fetch('https://tesla-milestone-portal.onrender.com/api/deposit', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            chatId: chatId,
            amount: amount
          })
        });

        if (response.ok) {
          alert("Payment proof submitted successfully! Your account balance has been updated.");
          window.location.href = 'dashboard.html';
        } else {
          throw new Error('Network transmission error.');
        }
      } catch (err) {
        console.error(err);
        alert("Network transmission error. Please try again.");
        btn.innerText = "Submit Payment Proof for Approval";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
